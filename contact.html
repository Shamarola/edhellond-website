<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Edhellond</title>
  <link rel="icon" href="/assets/logo.png">
  <meta name="description" content="Edhellond helps with influencer marketing, social media management, and project development. From campaigns to custom builds.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&text=J&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <a href="/" class="logo"><img src="/assets/logo.png" alt="Edhellond"></a>
      <nav style="display:flex; align-items:center;">
        <button class="menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
      </nav>
    </div>
  </header>

  <main>
    <section class="page">
      <div class="container">
        <h1>Contact</h1>
        <div class="prose"><p style="margin-bottom:40px">Tell us what you're working on, and we'll reply with a clear next step.</p><a href="mailto:hello@edhellond.com" class="btn">Email us</a><p style="margin-top:24px;font-size:0.9rem">hello@edhellond.com</p></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© Edhellond. All rights reserved.</p>
    </div>
  </footer>
  <div class="backdrop" onclick="toggleMenu(false)"></div>
  <aside class="side-menu" aria-label="Menu">
    <div class="top"><img src="/assets/logo.png" alt="Edhellond"><button class="menu-close" aria-label="Close menu" onclick="event.stopPropagation();toggleMenu(false)">&times;</button></div>
    <a class="item" href="/#services">Services</a>
    <a class="item" href="/about.html">About us</a>
    <a class="item" href="/contact.html">Contact</a>
    <a class="item" href="/faq.html">FAQs</a>
  </aside>
  <script>
    (function(){
      var menu=document.querySelector('.side-menu'),bd=document.querySelector('.backdrop'),btn=document.querySelector('.menu-btn'),pinned=false,t;
      function set(o){menu.classList.toggle('open',o);bd.classList.toggle('open',o&&pinned);}
      function enter(){clearTimeout(t);if(!pinned)set(true);}
      function leave(){if(pinned)return;t=setTimeout(function(){set(false);},250);}
      window.toggleMenu=function(o){pinned=!!o;set(!!o);};
      btn.addEventListener('mouseenter',enter);btn.addEventListener('mouseleave',leave);
      menu.addEventListener('mouseenter',enter);menu.addEventListener('mouseleave',leave);
      btn.addEventListener('click',function(e){e.stopPropagation();toggleMenu(true);});
      document.addEventListener('click',function(e){if(pinned&&!menu.contains(e.target))toggleMenu(false);});
      document.addEventListener('keydown',function(e){if(e.key==='Escape')toggleMenu(false);});
    })();
  </script>
</body>
</html>
